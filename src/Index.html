<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Load React, ReactDOM, Babel, and Tailwind via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // Inline SVG Icons (Replaces Lucide)
      const IconSave = ({size=18, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
      const IconPlus = ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
      const IconTrash = ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
      const IconCheck = ({size=16, strokeWidth=2, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>;
      const IconX = ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
      const IconSearch = ({size=16, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
      const IconUploadCloud = ({size=18, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path><polyline points="16 16 12 12 8 16"></polyline></svg>;
      const IconLoader = ({size=18, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;

      const INITIAL_STORES = ["cleveland", "chattanooga", "dalton", "asheville", "greenville", "charlotte", "knoxville", "national"];

      function App() {
        const [slugs, setSlugs] = useState([]);
        const [storeData, setStoreData] = useState({});
        
        const [newSlug, setNewSlug] = useState('');
        const [searchQuery, setSearchQuery] = useState('');
        const [showSaveModal, setShowSaveModal] = useState(false);
        
        const [isLoadingInit, setIsLoadingInit] = useState(true);
        const [isSaving, setIsSaving] = useState(false);
        const [saveSuccess, setSaveSuccess] = useState(false);
        const [errorMessage, setErrorMessage] = useState('');

        // Fetch data from Google Apps Script Backend on load
        useEffect(() => {
          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler((config) => {
                // If config exists in properties, use it. Otherwise, defaults are sent back.
                if (config) {
                  setSlugs(config.slugList);
                  setStoreData(config.storeData);
                }
                setIsLoadingInit(false);
              })
              .withFailureHandler((err) => {
                setErrorMessage("Failed to load config from server.");
                setIsLoadingInit(false);
              })
              .getConfigFromProperties();
          } else {
             // Fallback for local debugging outside GAS
             setIsLoadingInit(false);
          }
        }, []);

        const toggleProduct = (store, slug) => {
          setStoreData(prev => {
            const currentStoreSlugs = prev[store] || [];
            const hasSlug = currentStoreSlugs.includes(slug);
            return {
              ...prev,
              [store]: hasSlug ? currentStoreSlugs.filter(s => s !== slug) : [...currentStoreSlugs, slug]
            };
          });
        };

        const toggleAllStores = (slug, isCurrentlyIndeterminate, isCurrentlyAll) => {
          setStoreData(prev => {
            const newData = { ...prev };
            const shouldAdd = !isCurrentlyAll; 
            INITIAL_STORES.forEach(store => {
              const storeSlugs = newData[store] || [];
              const hasSlug = storeSlugs.includes(slug);
              if (shouldAdd && !hasSlug) {
                newData[store] = [...storeSlugs, slug];
              } else if (!shouldAdd && hasSlug) {
                newData[store] = storeSlugs.filter(s => s !== slug);
              }
            });
            return newData;
          });
        };

        const handleAddSlug = (e) => {
          e.preventDefault();
          if (!newSlug.trim()) return;
          const formattedSlug = newSlug.trim().toLowerCase().replace(/[\s_]+/g, '-');
          if (!slugs.includes(formattedSlug)) {
            setSlugs(prev => [...prev, formattedSlug].sort());
          }
          setNewSlug('');
        };

        const removeSlug = (slugToRemove) => {
          if (confirm(`Are you sure you want to completely remove "${slugToRemove}"?`)) {
            setSlugs(prev => prev.filter(s => s !== slugToRemove));
            setStoreData(prev => {
              const newData = { ...prev };
              Object.keys(newData).forEach(store => {
                newData[store] = newData[store].filter(s => s !== slugToRemove);
              });
              return newData;
            });
          }
        };

        const handleSaveToGas = () => {
          setIsSaving(true);
          setErrorMessage('');
          const payload = { slugList: slugs, storeData };

          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler((res) => {
                setSaveSuccess(true);
                setTimeout(() => {
                  setSaveSuccess(false);
                  setShowSaveModal(false);
                }, 2000);
                setIsSaving(false);
              })
              .withFailureHandler((err) => {
                setErrorMessage("Failed to save: " + err.message);
                setIsSaving(false);
              })
              .saveConfigToProperties(payload);
          } else {
             setErrorMessage("Cannot save outside of Google Apps Script environment.");
             setIsSaving(false);
          }
        };

        const filteredSlugs = useMemo(() => {
          if (!searchQuery) return slugs;
          return slugs.filter(s => s.toLowerCase().includes(searchQuery.toLowerCase()));
        }, [slugs, searchQuery]);

        if (isLoadingInit) {
          return (
            <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center text-slate-500">
              <IconLoader size={32} className="animate-spin mb-4 text-blue-600" />
              <p>Loading Store Configuration...</p>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-slate-50 text-slate-900 font-sans p-6">
            <div className="max-w-7xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[calc(100vh-3rem)]">
              
              <header className="px-6 py-4 border-b border-slate-200 bg-white flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0">
                <div>
                  <h1 className="text-2xl font-bold text-slate-800">Store Matrix Configurator</h1>
                  <p className="text-sm text-slate-500 mt-1">Manage product slugs and store availability</p>
                </div>
                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <button onClick={() => setShowSaveModal(true)} className="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-sm whitespace-nowrap w-full sm:w-auto">
                    <IconUploadCloud size={18} />
                    Save to Script
                  </button>
                </div>
              </header>

              <div className="px-6 py-3 border-b border-slate-200 bg-slate-50 flex flex-col lg:flex-row justify-between items-center gap-4 shrink-0">
                <form onSubmit={handleAddSlug} className="flex items-center gap-2 w-full lg:w-auto">
                  <input type="text" placeholder="Add new product slug..." value={newSlug} onChange={(e) => setNewSlug(e.target.value)} className="flex-1 lg:w-64 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                  <button type="submit" disabled={!newSlug.trim()} className="flex items-center gap-1 bg-slate-800 hover:bg-slate-900 disabled:bg-slate-300 text-white px-3 py-2 rounded-lg text-sm font-medium transition-colors">
                    <IconPlus size={16} /> Add
                  </button>
                </form>
                <div className="relative w-full lg:w-64">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch size={16} /></span>
                  <input type="text" placeholder="Search products..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                </div>
              </div>

              <div className="flex-1 overflow-auto relative bg-white">
                <table className="w-full text-left border-collapse min-w-max">
                  <thead className="sticky top-0 z-20 bg-white shadow-sm ring-1 ring-slate-200">
                    <tr>
                      <th className="sticky left-0 z-30 bg-white px-6 py-4 font-semibold text-slate-700 w-1/4 min-w-[250px] shadow-[1px_0_0_0_#e2e8f0]">
                        <div className="flex items-center justify-between">
                          <span>Product Slug ({filteredSlugs.length})</span>
                        </div>
                      </th>
                      {INITIAL_STORES.map(store => (
                        <th key={store} className="px-4 py-4 font-semibold text-slate-700 text-center min-w-[100px] border-l border-slate-100">
                          <div className="capitalize">{store}</div>
                          <div className="text-xs font-normal text-slate-400 mt-1">{storeData[store]?.length || 0} items</div>
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredSlugs.map(slug => {
                      const storeCountWithSlug = INITIAL_STORES.filter(s => storeData[s]?.includes(slug)).length;
                      const isAll = storeCountWithSlug === INITIAL_STORES.length;
                      const isIndeterminate = !isAll && storeCountWithSlug > 0;

                      return (
                        <tr key={slug} className="hover:bg-blue-50/50 group transition-colors">
                          <td className="sticky left-0 z-10 bg-white group-hover:bg-blue-50/50 px-6 py-3 font-medium text-slate-700 flex items-center justify-between shadow-[1px_0_0_0_#e2e8f0] transition-colors">
                            <div className="flex items-center gap-3 overflow-hidden">
                              <button onClick={() => toggleAllStores(slug, isIndeterminate, isAll)} className={`w-4 h-4 rounded flex items-center justify-center border focus:outline-none shrink-0 ${isAll ? 'bg-blue-600 border-blue-600 text-white' : isIndeterminate ? 'bg-blue-100 border-blue-300 text-blue-600' : 'border-slate-300 bg-white'}`}>
                                {isAll && <IconCheck size={12} strokeWidth={3} />}
                                {isIndeterminate && <div className="w-2 h-0.5 bg-blue-600 rounded-full" />}
                              </button>
                              <span className="truncate" title={slug}>{slug}</span>
                            </div>
                            <button onClick={() => removeSlug(slug)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-1.5 rounded-md hover:bg-red-50 shrink-0 ml-2" title="Delete product">
                              <IconTrash size={16} />
                            </button>
                          </td>
                          {INITIAL_STORES.map(store => {
                            const isChecked = storeData[store]?.includes(slug);
                            return (
                              <td key={`${slug}-${store}`} className="px-4 py-3 text-center border-l border-slate-100">
                                <label className="flex items-center justify-center w-full h-full cursor-pointer p-1">
                                  <input type="checkbox" checked={!!isChecked} onChange={() => toggleProduct(store, slug)} className="hidden" />
                                  <div className={`w-5 h-5 rounded flex items-center justify-center transition-colors border ${isChecked ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-300 hover:border-blue-400'}`}>
                                    {isChecked && <IconCheck size={14} strokeWidth={3} />}
                                  </div>
                                </label>
                              </td>
                            )
                          })}
                        </tr>
                      );
                    })}
                    {filteredSlugs.length === 0 && (
                      <tr>
                        <td colSpan={INITIAL_STORES.length + 1} className="px-6 py-12 text-center text-slate-500">
                          No product slugs found. Try a different search or add a new one.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Save Modal */}
            {showSaveModal && (
              <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col transform transition-all">
                  <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                      <IconUploadCloud size={22} className="text-blue-600" /> Confirm Save
                    </h2>
                    <button onClick={() => !isSaving && setShowSaveModal(false)} className="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition-colors disabled:opacity-50" disabled={isSaving}>
                      <IconX size={20} />
                    </button>
                  </div>
                  
                  <div className="p-6">
                    <p className="text-sm text-slate-600 mb-6">
                      Are you sure you want to push these changes to your active HubSpot Webhook? The routing will update immediately.
                    </p>
                    {errorMessage && <div className="p-3 mb-4 bg-red-50 text-red-700 text-sm rounded-lg border border-red-100">{errorMessage}</div>}
                    {saveSuccess && <div className="p-3 mb-4 bg-green-50 text-green-700 text-sm rounded-lg border border-green-100 flex items-center gap-2"><IconCheck size={16} /> Configuration updated!</div>}
                  </div>
                  
                  <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                    <button onClick={() => setShowSaveModal(false)} disabled={isSaving} className="px-4 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-200 transition-colors disabled:opacity-50">Cancel</button>
                    <button onClick={handleSaveToGas} disabled={isSaving || saveSuccess} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-75 disabled:cursor-not-allowed">
                      {isSaving ? <><IconLoader size={18} className="animate-spin" />Saving...</> : saveSuccess ? <><IconCheck size={18} />Saved!</> : <><IconSave size={18} />Push Live</>}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
